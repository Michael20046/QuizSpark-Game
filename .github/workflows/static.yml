# QuizSpark GitHub Pages deployment
name: Deploy QuizSpark to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate main JavaScript module
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          match = re.search(r'<script type="module">\\s*(.*?)</script>', html, re.S)
          if not match:
              raise SystemExit("QuizSpark main module was not found.")
          Path("/tmp/quizspark-main.mjs").write_text(match.group(1), encoding="utf-8")
          PY
          node --check /tmp/quizspark-main.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload website files
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
          name: github-pages-${{ github.run_attempt }}

      # Allow GitHub Actions artifact metadata to become available before deployment lookup.
      - name: Wait for Pages artifact registration
        run: sleep 15

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
