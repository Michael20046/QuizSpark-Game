

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuizSpark Game</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
  text-align: center;
  padding: 20px;
}
.container {
  max-width: 500px;
  margin: 40px auto;
  background: #1e293b;
  padding: 25px;
  border-radius: 18px;
}
h1 { color: #38bdf8; }
button {
  display: block;
  width: 100%;
  padding: 14px;
  margin: 12px 0;
  border: none;
  border-radius: 10px;
  background: #0ea5e9;
  color: white;
  font-size: 16px;
}
button:disabled { opacity: 0.6; }
#result { color: #4ade80; }
</style>
</head>
<body>
<div class="container">
<h1>⚡ QuizSpark</h1>
<p>Test your knowledge and earn points!</p>
<h3 id="score">Points: 0</h3>
<h2 id="question">Welcome to QuizSpark!</h2>
<div id="answers"></div>
<p id="result">Press Start to begin.</p>
<button id="start" onclick="startQuiz()">Start Quiz</button>
</div>

<script>
const questions = [
{
q: "What is the capital of France?",
a: ["London", "Paris", "Rome", "Madrid"],
correct: 1
},
{
q: "Which planet is known as the Red Planet?",
a: ["Earth", "Venus", "Mars", "Jupiter"],
correct: 2
},
{
q: "How many days are in a week?",
a: ["5", "6", "7", "8"],
correct: 2
},
{
q: "Which animal is called the King of the Jungle?",
a: ["Tiger", "Lion", "Elephant", "Leopard"],
correct: 1
},
{
q: "What is 10 + 5?",
a: ["12", "15", "20", "25"],
correct: 1
}
];

let current = 0;
let points = 0;
let locked = false;

function startQuiz() {
current = 0;
points = 0;
document.getElementById("start").style.display = "none";
showQuestion();
}

function showQuestion() {
document.getElementById("score").innerText = "Points: " + points;

if (current >= questions.length) {
document.getElementById("question").innerText = "Quiz Completed!";
document.getElementById("answers").innerHTML = "";
document.getElementById("result").innerText =
"Congratulations! You earned " + points + " points!";
document.getElementById("start").innerText = "Play Again";
document.getElementById("start").style.display = "block";
return;
}

const q = questions[current];
document.getElementById("question").innerText = q.q;
document.getElementById("result").innerText =
"Question " + (current + 1) + " of " + questions.length;

const answers = document.getElementById("answers");
answers.innerHTML = "";

q.a.forEach((answer, index) => {
const btn = document.createElement("button");
btn.innerText = answer;
btn.onclick = () => checkAnswer(index);
answers.appendChild(btn);
});
}

function checkAnswer(index) {
if (locked) return;
locked = true;

if (index === questions[current].correct) {
points += 10;
document.getElementById("result").innerText = "Correct! +10 points!";
} else {
document.getElementById("result").innerText = "Wrong answer! Keep going!";
}

document.getElementById("score").innerText = "Points: " + points;

setTimeout(() => {
current++;
locked = false;
showQuestion();
}, 1000);
}
</script>
</body>
</html>
