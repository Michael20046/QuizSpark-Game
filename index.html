
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuizSpark - Play, Learn and Earn!</title>
<meta name="description" content="Play 150 exciting quiz questions, test your knowledge and earn points with QuizSpark.">
<meta name="theme-color" content="#101044">
<meta property="og:title" content="QuizSpark - Play, Learn and Earn!">
<meta property="og:description" content="Challenge yourself with 150 exciting quiz questions.">
<meta property="og:url" content="https://michael20046.github.io/QuizSpark-Game/">
<meta property="og:image" content="https://michael20046.github.io/QuizSpark-Game/quizspark-logo.png">
<link rel="icon" type="image/png" href="./quizspark-logo.png">
<link rel="apple-touch-icon" href="./quizspark-logo.png">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 16px;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: white;
  text-align: center;
  background: linear-gradient(145deg, #080d27, #171044, #101827);
}

.container {
  width: 100%;
  max-width: 520px;
  margin: 20px auto;
  padding: 22px;
  background: #1e293b;
  border: 1px solid #475569;
  border-radius: 20px;
  box-shadow: 0 12px 40px rgba(0,0,0,.35);
}

.logo {
  display: block;
  width: 170px;
  max-width: 75%;
  height: auto;
  margin: 0 auto 12px;
  border-radius: 16px;
}

h1 { color: #facc15; }
h2 { color: #38bdf8; }

p { line-height: 1.5; }

input {
  display: block;
  width: 100%;
  padding: 14px;
  margin: 10px 0;
  border: 0;
  border-radius: 9px;
  font-size: 16px;
}

button {
  display: block;
  width: 100%;
  padding: 14px;
  margin: 10px 0;
  border: 0;
  border-radius: 10px;
  background: linear-gradient(90deg, #d97706, #facc15);
  color: #171717;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .55;
  cursor: not-allowed;
}

.secondary {
  background: #475569;
  color: white;
}

.google {
  background: white;
  color: #222;
}

.answer {
  background: #334155;
  color: white;
  text-align: left;
}

.answer.correct {
  background: #15803d;
}

.answer.wrong {
  background: #b91c1c;
}

.hidden { display: none !important; }

#score {
  color: #facc15;
  font-size: 23px;
  font-weight: bold;
}

#progress {
  color: #cbd5e1;
  font-size: 14px;
}

#result {
  min-height: 25px;
  font-weight: bold;
  color: #4ade80;
}

#authMessage {
  color: #38bdf8;
  overflow-wrap: anywhere;
}

#question {
  min-height: 65px;
  line-height: 1.4;
}

footer {
  margin-top: 25px;
  color: #94a3b8;
  font-size: 12px;
}

@media (max-width: 480px) {
  .container { padding: 17px; }
  .logo { width: 145px; }
}
</style>
</head>

<body>
<div class="container">

  <img src="./quizspark-logo.png"
       alt="QuizSpark Gold Logo"
       class="logo">

  <h1>⚡ QuizSpark</h1>
  <p>Play, learn and earn points!</p>

  <!-- PLAYER ACCOUNT -->
  <section id="authSection">
    <h2>Player Account</h2>

    <input id="name" type="text" placeholder="Your name">
    <input id="email" type="email" placeholder="Email address">
    <input id="password" type="password" placeholder="Password">

    <button id="signupBtn">Create Account</button>
    <button id="loginBtn" class="secondary">Sign In</button>
    <button id="googleBtn" class="google">Continue with Google</button>

    <p id="authMessage">Create an account or sign in to play.</p>
  </section>

  <!-- SIGNED-IN PLAYER -->
  <section id="userSection" class="hidden">
    <p id="welcome"></p>
    <button id="logoutBtn" class="secondary">Sign Out</button>
  </section>

  <hr>

  <!-- QUIZ -->
  <section id="gameSection">
    <h3 id="score">Points: 0</h3>
    <p id="progress">150 questions waiting for you!</p>
    <h2 id="question">Ready to test your knowledge?</h2>
    <div id="answers"></div>
    <p id="result">Press Start Quiz when you're ready.</p>
    <button id="startBtn">Start Quiz</button>
  </section>

  <footer>
    © 2026 QuizSpark. All rights reserved.
  </footer>
</div>

<script type="module">
import { initializeApp } from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged,
  updateProfile
} from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* =====================================
   FIREBASE CONFIGURATION
   REPLACE THESE PLACEHOLDERS WITH YOUR
   EXISTING FIREBASE PROJECT VALUES.
===================================== */

const firebaseConfig = {
  apiKey: "PASTE_YOUR_API_KEY_HERE",
  authDomain: "PASTE_YOUR_AUTH_DOMAIN_HERE",
  projectId: "PASTE_YOUR_PROJECT_ID_HERE",
  storageBucket: "PASTE_YOUR_STORAGE_BUCKET_HERE",
  messagingSenderId: "PASTE_YOUR_MESSAGING_SENDER_ID_HERE",
  appId: "PASTE_YOUR_APP_ID_HERE"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

/* =====================================
   ACCOUNT ELEMENTS
===================================== */

const nameInput = document.getElementById("name");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const authMessage = document.getElementById("authMessage");

function showMessage(message) {
  authMessage.textContent = message;
}

document.getElementById("signupBtn").onclick = async () => {
  const name = nameInput.value.trim();
  const email = emailInput.value.trim();
  const password = passwordInput.value;

  if (!name || !email || !password) {
    showMessage("Please enter your name, email and password.");
    return;
  }

  if (password.length < 6) {
    showMessage("Your password must contain at least 6 characters.");
    return;
  }

  try {
    const credential = await createUserWithEmailAndPassword(
      auth, email, password
    );

    await updateProfile(credential.user, {
      displayName: name
    });

    showMessage("Account created successfully!");
  } catch (error) {
    showMessage(error.message);
  }
};

document.getElementById("loginBtn").onclick = async () => {
  const email = emailInput.value.trim();
  const password = passwordInput.value;

  if (!email || !password) {
    showMessage("Enter your email and password.");
    return;
  }

  try {
    await signInWithEmailAndPassword(auth, email, password);
    showMessage("Welcome back!");
  } catch (error) {
    showMessage(error.message);
  }
};

document.getElementById("googleBtn").onclick = async () => {
  try {
    await signInWithPopup(auth, provider);
    showMessage("Google sign-in successful!");
  } catch (error) {
    showMessage(error.message);
  }
};

document.getElementById("logoutBtn").onclick = async () => {
  try {
    await signOut(auth);
    showMessage("You have signed out.");
  } catch (error) {
    showMessage(error.message);
  }
};

onAuthStateChanged(auth, (user) => {
  const authSection = document.getElementById("authSection");
  const userSection = document.getElementById("userSection");

  if (user) {
    authSection.classList.add("hidden");
    userSection.classList.remove("hidden");

    document.getElementById("welcome").textContent =
      "Welcome, " + (user.displayName || user.email) + "!";
  } else {
    authSection.classList.remove("hidden");
    userSection.classList.add("hidden");
  }
});

/* =====================================
   QUESTION BANK
   25 GENERAL KNOWLEDGE QUESTIONS,
   EACH ASKED IN TWO DIFFERENT WAYS.
===================================== */

const facts = [
  ["What is the capital of France?", "Which city is the capital of France?", "Paris", ["London", "Rome", "Madrid"]],
  ["Which planet is called the Red Planet?", "Mars is known by what nickname?", "Mars", ["Venus", "Jupiter", "Mercury"]],
  ["How many days are in a week?", "A standard week contains how many days?", "7", ["5", "6", "8"]],
  ["Which animal is called the King of the Jungle?", "The lion is often called what?", "King of the Jungle", ["King of the Ocean", "Forest Giant", "Desert King"]],
  ["What is the largest ocean on Earth?", "Which ocean is the biggest?", "Pacific Ocean", ["Atlantic Ocean", "Indian Ocean", "Arctic Ocean"]],
  ["What is the chemical symbol for water?", "H2O is the chemical formula for what?", "Water", ["Oxygen", "Hydrogen", "Salt"]],
  ["How many sides does a triangle have?", "A three-sided shape is called what?", "3", ["4", "5", "6"]],
  ["Which country is famous for the Great Wall?", "The Great Wall is located in which country?", "China", ["Japan", "India", "Thailand"]],
  ["What is the fastest land animal?", "Which animal can run fastest on land?", "Cheetah", ["Lion", "Horse", "Leopard"]],
  ["Which star is closest to Earth?", "Earth's nearest star is what?", "The Sun", ["Sirius", "Polaris", "The Moon"]],
  ["What is the largest planet in our solar system?", "Which planet is biggest?", "Jupiter", ["Earth", "Mars", "Saturn"]],
  ["How many continents are there?", "Earth is commonly divided into how many continents?", "7", ["5", "6", "8"]],
  ["What is the capital of Japan?", "Tokyo is the capital of which country?", "Japan", ["China", "South Korea", "Vietnam"]],
  ["Which gas do humans need to breathe?", "Humans need which gas for respiration?", "Oxygen", ["Carbon dioxide", "Helium", "Nitrogen"]],
  ["What is the freezing point of water in Celsius?", "At what Celsius temperature does water freeze?", "0°C", ["10°C", "50°C", "100°C"]],
  ["Which organ pumps blood around the body?", "What organ circulates blood?", "The heart", ["The lungs", "The brain", "The liver"]],
  ["How many hours are in one day?", "One full day contains how many hours?", "24", ["12", "18", "36"]],
  ["Which language is primarily spoken in Brazil?", "Brazil's main language is what?", "Portuguese", ["Spanish", "French", "English"]],
  ["What is the capital of Nigeria?", "Abuja is the capital of which country?", "Nigeria", ["Ghana", "Kenya", "Egypt"]],
  ["Which instrument has black and white keys?", "What musical instrument uses black and white keys?", "Piano", ["Drum", "Flute", "Trumpet"]],
  ["What is the biggest mammal?", "Which mammal is the largest in the world?", "Blue whale", ["Elephant", "Giraffe", "Hippopotamus"]],
  ["Which planet is famous for its rings?", "Saturn is especially known for what?", "Rings", ["Oceans", "Red clouds", "Two moons"]],
  ["How many months are in a year?", "A calendar year has how many months?", "12", ["10", "11", "13"]],
  ["What is the capital of Italy?", "Rome is the capital of which country?", "Italy", ["Greece", "Spain", "Portugal"]],
  ["Which part of a plant absorbs water?", "A plant mainly takes up water through what?", "Roots", ["Flowers", "Leaves", "Fruit"]]
];

const questions = [];

facts.forEach(([q1, q2, answer, wrong]) => {
  questions.push({
    q: q1,
    a: [answer, ...wrong],
    correct: 0
  });

  questions.push({
    q: q2,
    a: [answer, ...wrong],
    correct: 0
  });
});

/* =====================================
   100 MATHS QUESTIONS
===================================== */

function makeMathQuestion(question, answer) {
  const wrongAnswers = [
    answer + 2,
    answer + 5,
    Math.max(0, answer - 3)
  ];

  const options = [answer, ...wrongAnswers]
    .map(String);

  return {
    q: question,
    a: options,
    correct: 0
  };
}

for (let i = 0; i < 25; i++) {
  const a = i + 5;
  const b = (i % 9) + 2;
  const answer = a + b;
  questions.push(makeMathQuestion(
    `Maths: What is ${a} + ${b}?`,
    answer
  ));
}

for (let i = 0; i < 25; i++) {
  const a = i + 20;
  const b = (i % 10) + 2;
  const answer = a - b;
  questions.push(makeMathQuestion(
    `Maths: What is ${a} - ${b}?`,
    answer
  ));
}

for (let i = 0; i < 25; i++) {
  const a = (i % 12) + 2;
  const b = (i % 8) + 2;
  const answer = a * b;
  questions.push(makeMathQuestion(
    `Maths: What is ${a} × ${b}?`,
    answer
  ));
}

for (let i = 0; i < 25; i++) {
  const b = (i % 9) + 2;
  const answer = (i % 12) + 2;
  const a = b * answer;
  questions.push(makeMathQuestion(
    `Maths: What is ${a} ÷ ${b}?`,
    answer
  ));
}

/* =====================================
   GAME SETTINGS
===================================== */

let current = 0;
let points = 0;
let locked = false;
let gameQuestions = [];

const questionElement = document.getElementById("question");
const answersElement = document.getElementById("answers");
const resultElement = document.getElementById("result");
const scoreElement = document.getElementById("score");
const progressElement = document.getElementById("progress");
const startButton = document.getElementById("startBtn");

function shuffle(array) {
  const copy = [...array];

  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }

  return copy;
}

function startQuiz() {
  current = 0;
  points = 0;
  locked = false;

  gameQuestions = shuffle(questions);

  scoreElement.textContent = "Points: 0";
  startButton.classList.add("hidden");

  showQuestion();
}

function showQuestion() {
  if (current >= gameQuestions.length) {
    finishQuiz();
    return;
  }

  const q = gameQuestions[current];

  questionElement.textContent = q.q;
  progressElement.textContent =
    `Question ${current + 1} of ${gameQuestions.length}`;

  resultElement.textContent =
    `Correct answer reward: ${(current + 1) * 10} points`;

  answersElement.innerHTML = "";

  const shuffledAnswers = shuffle(
    q.a.map((answer, index) => ({
      answer,
      isCorrect: index === q.correct
    }))
  );

  shuffledAnswers.forEach((item) => {
    const button = document.createElement("button");
    button.className = "answer";
    button.textContent = item.answer;

    button.onclick = () => checkAnswer(item.isCorrect, button);

    answersElement.appendChild(button);
  });
}

function checkAnswer(isCorrect, selectedButton) {
  if (locked) return;

  locked = true;

  const buttons = answersElement.querySelectorAll("button");
  buttons.forEach(button => button.disabled = true);

  if (isCorrect) {
    const reward = (current + 1) * 10;
    points += reward;

    selectedButton.classList.add("correct");
    resultElement.textContent = `Correct! You earned ${reward} points!`;
  } else {
    selectedButton.classList.add("wrong");
    resultElement.textContent = "Not quite! Keep learning and try the next one.";

    const q = gameQuestions[current];
    const correctAnswer = q.a[q.correct];

    buttons.forEach(button => {
      if (button.textContent === correctAnswer) {
        button.classList.add("correct");
      }
    });
  }

  scoreElement.textContent = "Points: " + points;

  setTimeout(() => {
    current++;
    locked = false;
    showQuestion();
  }, 1200);
}

function finishQuiz() {
  questionElement.textContent = "🏆 Quiz Completed!";
  answersElement.innerHTML = "";
  progressElement.textContent = "You completed all 150 questions!";
  resultElement.textContent =
    `Amazing effort! Your final score is ${points} points.`;

  startButton.textContent = "Play Again";
  startButton.classList.remove("hidden");
}

startButton.onclick = startQuiz;

</script>
</body>
  </html>
