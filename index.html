function showFriendlyError(error) {

  const messages = {
    "auth/email-already-in-use":
      "This email already has an account. Please sign in.",

    "auth/invalid-email":
      "Please enter a valid email address.",

    "auth/weak-password":

    "permission-denied":

  const message =

  showMessage(message);

  console.error("QuizSpark error:", error);
}


/* =====================================
   6. PLAYER PROFILE
===================================== */

async function createPlayerProfile(user) {

  const playerRef = doc(db, "players", user.uid);

  const snapshot = await getDoc(playerRef);

  if (!snapshot.exists()) {

    await setDoc(playerRef, {
      name: user.displayName || user.email || "Player",
      email: user.email || "",
      points: 0,
      createdAt: serverTimestamp()
    });

  } else {

    const data = snapshot.data();

    if (
      user.displayName &&
      data.name !== user.displayName
    ) {

      await setDoc(playerRef, {
        name: user.displayName
      }, { merge: true });

    }
  }

  await loadPlayerPoints(user);
}


/* =====================================
   7. LOAD SAVED POINTS
===================================== */

async function loadPlayerPoints(user) {

  const playerRef = doc(db, "players", user.uid);

  const snapshot = await getDoc(playerRef);

  if (!snapshot.exists()) {
    throw new Error("Player profile does not exist.");
  }

  const savedPoints = Number(snapshot.data().points) || 0;

  playerPointsElement.textContent =
    "Your saved points: " + savedPoints.toLocaleString();

}

document.getElementById("signupBtn").onclick =
async function() {

  const name = nameInput.value.trim();

  const email = emailInput.value.trim();

  const password = passwordInput.value;

  if (!name || !email || !password) {

    showMessage(
      "Please enter your name, email and password."
    );

    return;
  }

  if (password.length < 6) {

    showMessage(
      "Your password must contain at least 6 characters."
    );

    return;
  }

  try {

    showMessage("Creating your account...");

    const credential =
      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );

    await updateProfile(credential.user, {
      displayName: name
    });

    await createPlayerProfile(credential.user);

    showMessage(
      "Account created successfully! Welcome to QuizSpark."
    );

  } catch (error) {

    showFriendlyError(error);

  }

};

   9. EMAIL SIGN IN
===================================== */

document.getElementById("loginBtn").onclick =
async function() {

  const email = emailInput.value.trim();

  const password = passwordInput.value;

  if (!email || !password) {

    showMessage("Enter your email and password.");

    return;
  }

  try {

    showMessage("Signing you in...");

    await signInWithEmailAndPassword(
      auth,
      email,
      password

  } catch (error) {

    showFriendlyError(error);

  }

async function() {

    await signInWithPopup(auth, provider);

    showMessage("Google sign-in successful!");

    showFriendlyError(error);

/* =====================================
   11. SIGN OUT
===================================== */

document.getElementById("logoutBtn").onclick =
async function() {

  try {

    await signOut(auth);

    showFriendlyError(error);

};


/* =====================================
   12. AUTHENTICATION STATE
===================================== */

onAuthStateChanged(auth, async function(user) {

  currentUser = user;

  if (user) {

    authSection.classList.add("hidden");

    userSection.classList.remove("hidden");

    welcomeElement.textContent =
      "Welcome, " + (user.displayName || user.email) + "!";

    startButton.disabled = true;

    resultElement.textContent =
      "Loading your player account...";

    profileLoading = true;

    try {

      await createPlayerProfile(user);

      if (auth.currentUser?.uid !== user.uid) return;

      startButton.disabled = false;

      resultElement.textContent =
        "Your account is ready. Press Start Quiz!";

    } catch (error) {

      showFriendlyError(error);

      resultElement.textContent =
        "Your player account could not load. Please try again.";

    } finally {

      profileLoading = false;

    authSection.classList.remove("hidden");

    userSection.classList.add("hidden");

    startButton.disabled = true;

    playerPointsElement.textContent =
      "Your saved points: 0";

    welcomeElement.textContent = "";

function makeMathQuestion(question, answer) {

  const wrongAnswers = [
    answer + 2,
    answer + 5,
    Math.max(0, answer - 3)
  ];

  return {

    q: question,

    a: [answer, ...wrongAnswers].map(String),

    correct: 0

  };

}

/* =====================================
   16. SHUFFLE FUNCTION
===================================== */

function shuffle(array) {

  const copy = [...array];

  for (let i = copy.length - 1; i > 0; i--) {

    const j = Math.floor(Math.random() * (i + 1));

    [copy[i], copy[j]] = [copy[j], copy[i]];

  }

  return copy;

}
