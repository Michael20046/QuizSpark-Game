
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuizSpark Game</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
  text-align: center;
  padding: 15px;
}
.container {
  max-width: 500px;
  margin: 25px auto;
  background: #1e293b;
  padding: 25px;
  border-radius: 18px;
}
h1 { color: #38bdf8; }
input {
  box-sizing: border-box;
  width: 100%;
  padding: 13px;
  margin: 8px 0;
  border: none;
  border-radius: 8px;
  font-size: 16px;
}
button {
  display: block;
  width: 100%;
  padding: 14px;
  margin: 12px 0;
  border: none;
  border-radius: 10px;
  background: #0ea5e9;
  color: white;
  font-size: 16px;
  cursor: pointer;
}
button:disabled { opacity: 0.6; }
.google { background: white; color: #222; }
.secondary { background: #475569; }
#result { color: #4ade80; }
#authMessage { color: #38bdf8; }
.hidden { display: none !important; }
</style>
</head>

<body>

<div class="container">
<h1>⚡ QuizSpark</h1>
<p>Test your knowledge and earn points!</p>

<!-- PLAYER ACCOUNT -->
<div id="authSection">
<h2>Player Account</h2>

<input id="name" type="text" placeholder="Your name">
<input id="email" type="email" placeholder="Email address">
<input id="password" type="password" placeholder="Password">

<button id="signupBtn">Create Account</button>
<button id="loginBtn" class="secondary">Sign In</button>
<button id="googleBtn" class="google">Continue with Google</button>

<p id="authMessage">Create an account or sign in to QuizSpark.</p>
</div>

<!-- SIGNED IN PLAYER -->
<div id="userSection" class="hidden">
<p id="welcome"></p>
<button id="logoutBtn" class="secondary">Sign Out</button>
</div>

<hr>

<!-- QUIZ -->
<h3 id="score">Points: 0</h3>
<h2 id="question">Welcome to QuizSpark!</h2>
<div id="answers"></div>
<p id="result">Press Start to begin.</p>
<button id="start">Start Quiz</button>
</div>

<script type="module">

// FIREBASE CONNECTION
import { initializeApp } from
"https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged,
  signOut,
  updateProfile
} from
"https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBpADv380nomzd15tNPmruoYcok4VQ29VQ",
  authDomain: "quizspark-65dbd.firebaseapp.com",
  projectId: "quizspark-65dbd",
  storageBucket: "quizspark-65dbd.firebasestorage.app",
  messagingSenderId: "328231530287",
  appId: "1:328231530287:web:9a2f4bb9b92b5faa267bda"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

// ACCOUNT ELEMENTS
const nameInput = document.getElementById("name");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const authMessage = document.getElementById("authMessage");

function showMessage(message) {
  authMessage.innerText = message;
}

// CREATE ACCOUNT
document.getElementById("signupBtn").onclick =
async function () {
  const name = nameInput.value.trim();
  const email = emailInput.value.trim();
  const password = passwordInput.value;

  if (!name || !email || !password) {
    showMessage("Please fill in all fields.");
    return;
  }

  if (password.length < 6) {
    showMessage("Password must be at least 6 characters.");
    return;
  }

  try {
    const credential =
      await createUserWithEmailAndPassword(
        auth, email, password
      );

    await updateProfile(credential.user, {
      displayName: name
    });

    showMessage("Account created successfully!");
  } catch (error) {
    showMessage(error.message);
  }
};

// EMAIL LOGIN
document.getElementById("loginBtn").onclick =
async function () {
  const email = emailInput.value.trim();
  const password = passwordInput.value;

  if (!email || !password) {
    showMessage("Enter your email and password.");
    return;
  }

  try {
    await signInWithEmailAndPassword(
      auth, email, password
    );
    showMessage("Welcome back!");
  } catch (error) {
    showMessage(error.message);
  }
};

// GOOGLE LOGIN
document.getElementById("googleBtn").onclick =
async function () {
  try {
    await signInWithPopup(auth, provider);
    showMessage("Google sign-in successful!");
  } catch (error) {
    showMessage(error.message);
  }
};

// SIGN OUT
document.getElementById("logoutBtn").onclick =
async function () {
  try {
    await signOut(auth);
    showMessage("You have signed out.");
  } catch (error) {
    showMessage(error.message);
  }
};

// CHECK PLAYER LOGIN STATUS
onAuthStateChanged(auth, (user) => {
  if (user) {
    document.getElementById("authSection")
      .classList.add("hidden");

    document.getElementById("userSection")
      .classList.remove("hidden");

    document.getElementById("welcome").innerText =
      "Welcome, " + (user.displayName || user.email) + "!";

  } else {
    document.getElementById("authSection")
      .classList.remove("hidden");

    document.getElementById("userSection")
      .classList.add("hidden");
  }
});

// QUIZ QUESTIONS
const questions = [
{
q: "What is the capital of France?",
a: ["London", "Paris", "Rome", "Madrid"],
correct: 1
},
{
q: "Which planet is known as the Red Planet?",
a: ["Earth", "Venus", "Mars", "Jupiter"],
correct: 2
},
{
q: "How many days are in a week?",
a: ["5", "6", "7", "8"],
correct: 2
},
{
q: "Which animal is called the King of the Jungle?",
a: ["Tiger", "Lion", "Elephant", "Leopard"],
correct: 1
},
{
q: "What is 10 + 5?",
a: ["12", "15", "20", "25"],
correct: 1
}
];

let current = 0;
let points = 0;
let locked = false;

function startQuiz() {
  current = 0;
  points = 0;
  document.getElementById("start").style.display = "none";
  showQuestion();
}

function showQuestion() {
  document.getElementById("score").innerText =
    "Points: " + points;

  if (current >= questions.length) {
    document.getElementById("question").innerText =
      "Quiz Completed!";

    document.getElementById("answers").innerHTML = "";

    document.getElementById("result").innerText =
      "Congratulations! You earned " + points + " points!";

    document.getElementById("start").innerText = "Play Again";
    document.getElementById("start").style.display = "block";
    return;
  }

  const q = questions[current];

  document.getElementById("question").innerText = q.q;

  document.getElementById("result").innerText =
    "Question " + (current + 1) + " of " + questions.length;

  const answers = document.getElementById("answers");
  answers.innerHTML = "";

  q.a.forEach((answer, index) => {
    const btn = document.createElement("button");
    btn.innerText = answer;
    btn.onclick = () => checkAnswer(index);
    answers.appendChild(btn);
  });
}

function checkAnswer(index) {
  if (locked) return;
  locked = true;

  if (index === questions[current].correct) {
    points += 10;
    document.getElementById("result").innerText =
      "Correct! +10 points!";
  } else {
    document.getElementById("result").innerText =
      "Wrong answer! Keep going!";
  }

  document.getElementById("score").innerText =
    "Points: " + points;

  setTimeout(() => {
    current++;
    locked = false;
    showQuestion();
  }, 1000);
}

document.getElementById("start").onclick = startQuiz;

</script>
</body>
</html>
